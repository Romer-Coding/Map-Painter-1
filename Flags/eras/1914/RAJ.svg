<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- British Raj, 1914: deep blue field with the Star of India badge (a
       five-pointed star), the real governmental/ensign symbol of British
       India (used on official flags, decorations, and insignia through the
       Raj period). Simplified here to field + star, omitting the badge's
       historical motto ribbon and small crown detail. -->
  <rect width="900" height="600" fill="#00247D"/>
  <polygon points="450.0,170.0 480.6,257.9 573.6,259.8 499.5,316.1 526.4,405.2 450.0,352.0 373.6,405.2 400.5,316.1 326.4,259.8 419.4,257.9" fill="#F4C430" stroke="#B8860B" stroke-width="4"/>
  <circle cx="450" cy="300" r="30" fill="#00247D" stroke="#F4C430" stroke-width="5"/>
</svg>
