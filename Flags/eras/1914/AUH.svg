<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Austria-Hungary combined civil ensign, simplified (shields omitted):
       hoist half = Austrian red-white-red, fly half = Hungarian red-white-green. -->
  <rect width="900" height="600" fill="#ffffff"/>
  <rect x="0" y="0"   width="450" height="200" fill="#C8102E"/>
  <rect x="0" y="400" width="450" height="200" fill="#C8102E"/>
  <rect x="450" y="0"   width="450" height="200" fill="#C8102E"/>
  <rect x="450" y="400" width="450" height="200" fill="#436F4D"/>
</svg>
