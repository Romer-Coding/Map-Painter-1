<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Sultanate of Morocco, pre-1915: a plain red field. The green Seal of
       Solomon (pentagram) now on Morocco's modern flag wasn't added until
       November 1915, under Sultan Yusef during the French Protectorate --
       before that, the Sultanate's flag (in use since at least the mid-19th
       century) was simply plain red, no emblem. -->
  <rect width="900" height="600" fill="#C1272D"/>
</svg>
