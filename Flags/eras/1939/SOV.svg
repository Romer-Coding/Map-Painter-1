<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <!-- Soviet Union state flag (1:2): red field, gold hammer and sickle with
       star above in the upper hoist. Simplified original rendering of the
       public-domain state symbol. -->
  <rect width="1200" height="600" fill="#CD0000"/>
  <g fill="#FFD700">
    <!-- star, point up, above the emblem -->
    <polygon points="310,60 319.4,89.1 349.9,89.0 325.2,106.9 334.7,136.0 310,118 285.3,136.0 294.8,106.9 270.1,89.0 300.6,89.1"/>
    <!-- sickle blade (crescent, tips upper-right; handle attaches lower-right) -->
    <path d="M 270.4 187.0 A 112 112 0 1 1 402.8 339.5 A 101 101 0 0 0 270.4 187.0 Z"/>
    <!-- sickle handle: from blade's lower-right end toward bottom-right -->
    <rect x="357" y="330" width="27" height="105" rx="7" transform="rotate(-38 370 382)"/>
    <!-- hammer handle: upper-left to lower-right diagonal -->
    <rect x="266" y="170" width="23" height="245" rx="5" transform="rotate(-46 277 292)"/>
    <!-- hammer head: block at the handle's upper-left end -->
    <rect x="150" y="180" width="96" height="38" rx="5" transform="rotate(44 198 199)"/>
  </g>
</svg>
